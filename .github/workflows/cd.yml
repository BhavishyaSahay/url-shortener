# Continuous Deployment: after CI passes on main, build the Docker image, push
# it to GitHub Container Registry, and deploy it to the EC2 server.
#
#   push to main → CI ✓ → publish image (tagged with the commit SHA) → deploy over SSH
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # also allow running it by hand from the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push image
    # Only when CI succeeded for a push to main (not for pull requests or failed runs).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # the exact commit CI tested
      - id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/url-shortener" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

  deploy:
    name: Deploy to EC2
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true' # turned on once the server exists
    runs-on: ubuntu-latest
    environment: production # holds the SSH secrets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          TARGET: ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts # the server's identity, so we don't connect to an impostor
          # Copy the compose file and nginx config, then pull the new image and restart.
          scp -i ~/.ssh/deploy_key -r docker-compose.prod.yml nginx "$TARGET:/opt/url-shortener/"
          ssh -i ~/.ssh/deploy_key "$TARGET" "cd /opt/url-shortener && export IMAGE_TAG=$TAG && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --wait"
