# Continuous Integration: every pull request and every push to main.
#
#   lint-and-unit ─┐
#   integration   ─┼─ all three run in parallel; any failure fails CI
#   docker        ─┘  (and CD, which only starts after a green CI run on main)
#
# Nothing here needs secrets, so it runs safely for pull requests too.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A new push to the same PR cancels the previous, now-outdated run.
# Runs on main are never cancelled, so every commit on main gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

jobs:
  # ---------------------------------------------------------------------------
  lint-and-unit:
    name: Lint, audit & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `npm ci` runs `prisma generate`, which reads DATABASE_URL from
      # prisma.config.js. Nothing connects to it in this job.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm            # caches ~/.npm, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci             # exact versions from the lockfile; fails if it's out of sync

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        # Fail on high/critical advisories in what actually ships in the image.
        # (Dev tooling advisories are left to Dependabot: they never reach production.)
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Unit tests
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real PostgreSQL, Redis and Kafka, started by GitHub Actions before the job.
    # Same host ports as local development, so the test config works unchanged.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

      kafka:
        image: apache/kafka:4.1.0
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          # The tests run on the runner itself (not in a container), so a single
          # listener advertised as localhost:9092 is all that's needed here.
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 20s

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/url_shortener_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/url_shortener_test
      TEST_REDIS_URL: redis://localhost:6380/1
      TEST_KAFKA_BROKERS: localhost:9092

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        # Global setup applies the migrations (prisma migrate deploy) first.
        run: npm run test:integration

      - name: Check the schema and migrations are in sync
        # After migrating, diff the database against schema.prisma. Exit code 2
        # means someone changed the schema without creating a migration.
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  # ---------------------------------------------------------------------------
  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # BuildKit builder, needed for the GitHub Actions layer cache.
      - uses: docker/setup-buildx-action@v4

      # Build the three images exactly as production will, and load them into
      # the local Docker engine. The layer cache (scope per image) is shared with
      # CD, so the publish step on main mostly reuses these layers.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          target: runtime
          tags: url-shortener-api:dev
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          target: runtime
          tags: url-shortener-worker:dev
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          target: migrate
          tags: url-shortener-migrate:dev
          load: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Start the full stack
        # A throwaway secret, generated per run: the stack refuses to start without one.
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          export JWT_SECRET
          docker compose up -d --no-build --wait
          docker compose ps

      # Proves the IMAGES work, not just the code: config defaults, native
      # modules, networking, migrations, Kafka → worker. (A container-only
      # config bug in Phase 7 passed every unit/integration test.)
      - name: Smoke test through Nginx
        run: scripts/smoke-test.sh http://localhost:8080

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
