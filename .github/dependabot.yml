# Dependabot opens pull requests when dependencies have updates or security
# fixes. Each PR goes through CI like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for all minor/patch updates, instead of one per package.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker          # base images in docker/*.Dockerfile
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: github-actions  # actions used in .github/workflows
    directory: /
    schedule:
      interval: weekly
