# Production stack, meant for a single server (AWS EC2, Phase 9).
#
# Differences from docker-compose.yml (development):
#   - images are PULLED from a registry by tag (built and pushed by CI/CD, Phase 8),
#     never built on the server
#   - every secret is REQUIRED from the environment: compose refuses to start
#     if one is missing (${VAR:?message}), and no secret is written in this file
#   - no database/cache/broker ports on the host; only nginx is reachable
#   - the backend network is `internal`: those containers can't reach the internet
#   - memory/CPU limits sized for one small instance, restart policies, log rotation
#
# Usage on the server (with a .env file next to this one, chmod 600):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --wait
#   docker compose -f docker-compose.prod.yml ps
#
# Required variables: see .env.production.example

name: url-shortener

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-urlshortener}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-url_shortener}
  KAFKA_BROKERS: kafka:19092
  KAFKA_CLICKS_TOPIC: url-clicks
  SHUTDOWN_TIMEOUT_MS: 10000

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urlshortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 768m, cpus: "1.0" }
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 192m, cpus: "0.5" }   # 128 MB of data + Redis overhead
    restart: unless-stopped
    logging: *default-logging

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Only the internal listener: nothing outside the Docker network talks to Kafka.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Keep click events for 7 days or 1 GB per partition, whichever comes first,
      # so the broker can't fill the server's disk. The worker normally
      # consumes them within seconds; retention is the safety buffer for outages.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }     # 512 MB heap + JVM/page-cache overhead
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required, e.g. ghcr.io/<user>/url-shortener}-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-urlshortener}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-url_shortener}
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-api:${IMAGE_TAG:-latest}
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: { memory: 384m, cpus: "0.75" }
    environment:
      <<: *app-env
      SERVICE_NAME: url-shortener-api
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required, e.g. https://short.example.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # Secure cookies need HTTPS. Until TLS is set up (Phase 9), set COOKIE_SECURE=false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: 1
      DB_POOL_MAX: 10
    networks: [frontend, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging

  worker:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_NAME: analytics-worker
      KAFKA_CONSUMER_GROUP: analytics-worker
      DB_POOL_MAX: 5
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.5" }
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      # - "443:443"   # HTTPS, Phase 9
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { memory: 64m, cpus: "0.5" }
    restart: unless-stopped
    logging: *default-logging

networks:
  frontend:
  backend:
    # No route to the internet from this network: PostgreSQL, Redis, Kafka and
    # the worker never need to make outbound connections, so a compromised
    # container can't send data out or download tools. (The API can still reach
    # nginx through the frontend network.)
    internal: true

volumes:
  postgres-data:
  kafka-data:
