# Production stack for a single small server: AWS EC2 t3.micro (1 GB RAM, 2 vCPU).
#
# Differences from docker-compose.yml (development):
#   - images are PULLED from a registry by tag (built and pushed by CI/CD),
#     never built on the server
#   - every secret is REQUIRED from the environment: compose refuses to start
#     if one is missing (${VAR:?message}), and no secret is written in this file
#   - no database/cache ports on the host; only nginx is reachable
#   - the backend network is `internal`: those containers can't reach the internet
#   - memory limits sized for 1 GB of RAM (plus swap on the host), restart
#     policies, log rotation
#
# Usage on the server (with a .env file next to this one, chmod 600):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --wait
#   docker compose -f docker-compose.prod.yml ps
#
# Required variables: see .env.production.example

# Different project name from docker-compose.yml, so production commands can
# never touch (or --remove-orphans) development containers on the same machine.
name: url-shortener-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-urlshortener}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-url_shortener}
  REDIS_URL: redis://redis:6379/0
  CLICKS_STREAM: url-clicks
  SHUTDOWN_TIMEOUT_MS: 10000

services:
  postgres:
    image: postgres:17-alpine
    # Sized for a 1 GB server: Postgres's own page cache (shared_buffers) is
    # 128 MB by default; 64 MB is plenty for this data set. 50 connections
    # covers 2 API instances × 10 + the worker's 3, with room for psql.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urlshortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 256m, cpus: "1.0" }
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    # Cache + rate limits + the click-event stream (see docker-compose.yml for
    # why AOF persistence and volatile-lru eviction). 64 MB of data is plenty
    # here: cache entries are tiny, and processed stream entries are deleted.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.5" }   # maxmemory + overhead + AOF rewrite headroom
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required, e.g. ghcr.io/<user>/url-shortener}-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-urlshortener}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-url_shortener}
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-api:${IMAGE_TAG:-latest}
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: { memory: 192m, cpus: "0.75" }
    environment:
      <<: *app-env
      SERVICE_NAME: url-shortener-api
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required, e.g. http://<server-ip>}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # Secure cookies need HTTPS. Without TLS this must be false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: 1
      DB_POOL_MAX: 10
    networks: [frontend, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging

  worker:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_NAME: analytics-worker
      CLICKS_CONSUMER_GROUP: analytics-worker
      DB_POOL_MAX: 3
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 160m, cpus: "0.5" }
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { memory: 32m, cpus: "0.5" }
    restart: unless-stopped
    logging: *default-logging

networks:
  frontend:
  backend:
    # No route to the internet from this network: PostgreSQL, Redis and the
    # worker never need outbound connections, so a compromised container can't
    # send data out or download tools.
    internal: true

volumes:
  postgres-data:
  redis-data:
