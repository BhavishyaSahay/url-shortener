# Production (the EC2 server). Same services as docker-compose.yml, except:
#   - the image is pulled from GitHub Container Registry (built by CI/CD), never built here
#   - secrets come from the .env file next to this one (compose refuses to start without them)
#   - only nginx is reachable from outside, on port 80
#
# Deployed by the CD pipeline:
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml pull
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml up -d --wait

name: url-shortener-prod

x-app: &app
  image: ${IMAGE:?set IMAGE in .env}:${IMAGE_TAG:-latest}
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/url_shortener
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
    TRUST_PROXY: 1
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: url_shortener
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    <<: *app
    command: ["node", "worker/analytics.worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  nginx:
    image: nginx:1.28-alpine
    ports: ["80:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
