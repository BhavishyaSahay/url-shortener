# Local environment: the whole app in containers.
#
#   docker compose up -d --build --wait    build and start everything
#   docker compose logs -f api worker      follow logs
#   docker compose down                    stop (data is kept; add -v to delete it)
#
# Then open http://localhost:8080 (nginx → 2 API containers).
# Containers find each other by service name (postgres, redis, api).

name: url-shortener

# Shared by api, worker and migrate: the same image with different commands.
x-app: &app
  build: .
  image: url-shortener:dev
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url_shortener
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    APP_BASE_URL: http://localhost:8080
    TRUST_PROXY: 1
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports: ["127.0.0.1:5433:5432"] # for local tools and tests (5433 avoids a local Postgres)
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # Max 64 MB; when full, evict only keys with a TTL (cached URLs, rate-limit
    # counters), never the click queue.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["127.0.0.1:6380:6379"] # 6380 avoids a local Redis

  migrate: # runs once: applies database migrations, then exits
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    deploy:
      replicas: 2 # two identical API containers behind nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    <<: *app
    command: ["node", "worker/analytics.worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  nginx:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
