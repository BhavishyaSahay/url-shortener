# Nginx: the single public entry point.
#
#   Internet ──► Nginx :80 ──► api:3000 (instance 1)
#                          └─► api:3000 (instance 2)   round-robin load balancing
#
# Nginx is the only container with a published port. The API containers are
# reachable only from inside the Docker network.

worker_processes auto;            # one worker process per CPU core

events {
  worker_connections 1024;        # max simultaneous connections per worker
}

http {
  server_tokens off;              # don't advertise the nginx version

  # Structured (JSON) access log, one object per request, like the app's logs.
  # $request_id is also sent to the API (below), so one request can be traced
  # through both nginx's and the API's logs.
  log_format json escape=json
    '{"time":"$time_iso8601","service":"nginx","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;    # containers log to stdout/stderr; Docker collects it
  error_log  /dev/stderr warn;

  # --- Connection handling ----------------------------------------------------
  keepalive_timeout 30s;          # idle client connections are closed after 30 s
  client_header_timeout 10s;      # slow clients (e.g. slowloris attacks) are cut off
  client_body_timeout 10s;
  send_timeout 10s;
  # API bodies are tiny (Express also caps them at 10 KB). Reject larger ones
  # here with 413, before they ever reach Node.
  client_max_body_size 16k;

  # --- Basic abuse protection (per client IP) ---------------------------------
  # A coarse outer limit; the API's Redis rate limits handle the fine-grained
  # per-endpoint rules. 20 requests/s sustained with bursts of 40 is far above
  # normal human use.
  limit_req_zone  $binary_remote_addr zone=per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # --- Upstream: the API instances --------------------------------------------
  # Docker's embedded DNS (127.0.0.11) returns one IP per running "api"
  # container. `resolve` re-queries it every 10 s, so containers that are added,
  # removed or restarted with a new IP are picked up without reloading nginx.
  # (Without it, nginx resolves once at startup and keeps sending traffic to
  # stale IPs.) Available in open-source nginx since 1.27.3.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone api 64k;                 # shared memory, required for `resolve`
    server api:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;                 # reuse TCP connections to Node instead of opening one per request
  }

  server {
    listen 80;

    # Nginx's own liveness check (used by the container HEALTHCHECK).
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      limit_req  zone=per_ip burst=40 nodelay;
      limit_conn conn_per_ip 20;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";   # needed for upstream keepalive

      # Forwarding headers: without them the API would think every request comes
      # from nginx. With TRUST_PROXY=1, Express takes req.ip from the LAST
      # X-Forwarded-For entry, the one nginx appends ($remote_addr), so a client
      # can't spoof its IP by sending its own X-Forwarded-For header.
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Always nginx's own ID, overwriting anything the client sent.
      proxy_set_header X-Request-Id      $request_id;

      proxy_connect_timeout 3s;
      proxy_send_timeout    15s;
      proxy_read_timeout    15s;

      # If an instance is down or restarting, retry the request on another one.
      # Nginx never retries POST/PATCH (non-idempotent) unless told to, so a
      # URL can't be created twice by a retry.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
