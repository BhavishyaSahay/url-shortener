# Nginx: the single entry point. It forwards every request to the API
# containers, taking turns between them (round-robin load balancing).
events {}

http {
  # Docker's internal DNS. `resolve` below re-checks the IPs of the "api"
  # containers, so restarted or redeployed containers are found automatically.
  resolver 127.0.0.11 valid=10s;

  upstream api {
    zone api 64k;
    server api:3000 resolve;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      # Tell the API who the real client is (otherwise every request looks like it came from nginx).
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
