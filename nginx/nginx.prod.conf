# Nginx in production: HTTPS. Same as nginx.conf (used locally), plus:
#   - port 443 with the Let's Encrypt certificate
#   - port 80 only answers Let's Encrypt's domain check and redirects everything else to HTTPS
#
# The certificate is created and renewed by certbot into certbot/conf on the
# server. "url-shortener" is the name it was saved under (certbot --cert-name),
# so this file doesn't contain the domain.
events {}

http {
  # Docker's internal DNS. `resolve` below re-checks the IPs of the "api"
  # containers, so restarted or redeployed containers are found automatically.
  resolver 127.0.0.11 valid=10s;

  upstream api {
    zone api 64k;
    server api:3000 resolve;
  }

  server {
    listen 80;

    # Let's Encrypt checks we control the domain by fetching a file certbot puts here.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/url-shortener/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/url-shortener/privkey.pem;

    location / {
      proxy_pass http://api;
      # Tell the API who the real client is (otherwise every request looks like it came from nginx).
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
